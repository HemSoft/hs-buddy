name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: release-${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'main' || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.version.outputs.eligible }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify exact CI qualification
        run: |
          set -euo pipefail
          jobs="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --slurp)"
          count="$(jq '[.[].jobs[] | select(.name == "ci-complete" and .status == "completed" and .conclusion == "success")] | length' <<< "$jobs")"
          test "$count" = "1"
          test "$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$TARGET_SHA"

      - name: Read candidate version without checkout
        id: version
        run: |
          set -euo pipefail
          parent="$(gh api "repos/$REPOSITORY/git/commits/$TARGET_SHA" --jq '.parents[0].sha')"
          version="$(gh api "repos/$REPOSITORY/contents/package.json?ref=$TARGET_SHA" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
          parent_version="$(gh api "repos/$REPOSITORY/contents/package.json?ref=$parent" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::Invalid version in package.json: '$version'"
            exit 1
          fi
          tag="v$version"
          if [ "$version" = "$parent_version" ]; then
            published_count="$(
              gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
                jq --arg tag "$tag" \
                  '[.[][] | select(.tag_name == $tag and .draft == false)] | length'
            )"
            if [ "$published_count" != 0 ]; then
              echo "Revalidating published version $version from the qualified commit"
            else
              echo "Carrying forward unpublished version $version from a superseded run"
            fi
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package-release:
    name: Release package (${{ matrix.name }})
    needs: qualify
    if: needs.qualify.outputs.eligible == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    environment: release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            builder-platform: win
            target: nsis
            platform: win32
            arch: x64
            package-pattern: '*.exe'
            signing: authenticode
            signing-config: --config.forceCodeSigning=true
          - name: Linux x64
            runner: ubuntu-24.04
            builder-platform: linux
            target: deb
            platform: linux
            arch: x64
            package-pattern: '*.deb'
            signing: not-applicable
            signing-config: ''
          - name: macOS Intel
            runner: macos-15-intel
            builder-platform: mac
            target: dmg
            platform: darwin
            arch: x64
            package-pattern: '*.dmg'
            signing: apple-notarized
            signing-config: --config.forceCodeSigning=true --config.mac.notarize=true
          - name: macOS Apple silicon
            runner: macos-15
            builder-platform: mac
            target: dmg
            platform: darwin
            arch: arm64
            package-pattern: '*.dmg'
            signing: apple-notarized
            signing-config: --config.forceCodeSigning=true --config.mac.notarize=true
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.qualify.outputs.version }}
    steps:
      - name: Checkout qualified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify checked out revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install Linux display server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Install dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require Windows signing credentials
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          test -n "$WIN_CSC_LINK"
          test -n "$WIN_CSC_KEY_PASSWORD"

      - name: Require Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build application
        run: bunx vite build
        env:
          VITE_CONVEX_URL: https://balanced-trout-451.convex.cloud

      - name: Build signed Windows distributable
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: >-
          bunx electron-builder
          --${{ matrix.builder-platform }} ${{ matrix.target }} --${{ matrix.arch }}
          --publish never --config.npmRebuild=false ${{ matrix.signing-config }}

      - name: Build Linux distributable
        if: runner.os == 'Linux'
        shell: bash
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: >-
          bunx electron-builder
          --${{ matrix.builder-platform }} ${{ matrix.target }} --${{ matrix.arch }}
          --publish never --config.npmRebuild=false ${{ matrix.signing-config }}

      - name: Build signed macOS distributable
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: >-
          bunx electron-builder
          --${{ matrix.builder-platform }} ${{ matrix.target }} --${{ matrix.arch }}
          --publish never --config.npmRebuild=false ${{ matrix.signing-config }}

      - name: Locate release package
        shell: bash
        run: |
          set -euo pipefail
          packages=(release/"$VERSION"/${{ matrix.package-pattern }})
          test "${#packages[@]}" = 1
          test -f "${packages[0]}"
          echo "BUDDY_RELEASE_PACKAGE=${packages[0]}" >> "$GITHUB_ENV"

      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$BUDDY_RELEASE_PACKAGE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$BUDDY_RELEASE_PACKAGE"
          xcrun stapler validate "$BUDDY_RELEASE_PACKAGE"

      - name: Verify Windows signature and install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:BUDDY_RELEASE_PACKAGE
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode verification failed: $($signature.Status)"
          }
          ./scripts/install-windows-package.ps1 `
            -ReleaseDirectory release `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'Buddy-installed')

      - name: Install Linux distributable
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --yes "./$BUDDY_RELEASE_PACKAGE"
          executable="$(find /opt -type f -name Buddy -perm /111 -print -quit)"
          test -n "$executable"
          echo "BUDDY_PACKAGE_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Mount and verify macOS distributable
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/buddy-release-dmg"
          hdiutil attach "$BUDDY_RELEASE_PACKAGE" -nobrowse -readonly -mountpoint "$mount"
          executable="$mount/Buddy.app/Contents/MacOS/Buddy"
          test -x "$executable"
          codesign --verify --deep --strict --verbose=2 "$mount/Buddy.app"
          spctl --assess --type execute --verbose=2 "$mount/Buddy.app"
          xcrun stapler validate "$BUDDY_RELEASE_PACKAGE"
          echo "BUDDY_PACKAGE_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Start packaged application
        run: bun run package:smoke -- ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Unmount macOS distributable
        if: always() && runner.os == 'macOS'
        run: hdiutil detach "$RUNNER_TEMP/buddy-release-dmg" || true

      - name: Prepare verified release artifact
        shell: bash
        run: >-
          bun scripts/release-artifacts.ts prepare
          --file "$BUDDY_RELEASE_PACKAGE"
          --output release-assets
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --source-revision "$TARGET_SHA"
          --ci-run-id "$RUN_ID"
          --signing ${{ matrix.signing }}

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [qualify, package-release]
    if: needs.qualify.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: ${{ needs.qualify.outputs.tag }}
      VERSION: ${{ needs.qualify.outputs.version }}
    steps:
      - name: Checkout qualified release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-package-*
          path: release-input
          merge-multiple: true

      - name: Validate release artifacts and build checksum manifest
        run: >-
          bun scripts/release-artifacts.ts assemble
          --input release-input
          --output release-publish
          --source-revision "$TARGET_SHA"
          --ci-run-id "$RUN_ID"
          --version "$VERSION"

      - name: Create immutable tag and release
        run: |
          set -euo pipefail
          resolve_tag() {
            local object type
            object="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")" || return
            type="$(jq -r .object.type <<< "$object")" || return
            object="$(jq -r .object.sha <<< "$object")" || return
            if [ "$type" = "tag" ]; then
              object="$(gh api "repos/$REPOSITORY/git/tags/$object" --jq .object.sha)" || return
            fi
            printf '%s\n' "$object"
          }

          tag_owned=false
          tag_owned_object=""
          tag_owner_run_id="$RUN_ID"
          tag_owned_target="$TARGET_SHA"
          managed_release=false
          release_id=""
          release_marker="<!-- hs-buddy-release-ci:$RUN_ID -->"
          retry_command() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return
              fi
              sleep "$attempt"
            done
            "$@"
          }
          retry_api() {
            retry_command gh api "$@"
          }
          find_exact_release() {
            retry_api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
              jq -c --arg tag "$TAG" \
                '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("duplicate exact releases") else .[0] // null end'
          }
          wait_for_exact_release() {
            local attempt candidate
            for attempt in 1 2 3; do
              candidate="$(find_exact_release)" || return
              if [ "$candidate" != null ]; then
                printf '%s\n' "$candidate"
                return
              fi
              sleep "$attempt"
            done
            candidate="$(find_exact_release)" || return
            test "$candidate" != null
            printf '%s\n' "$candidate"
          }
          validate_release_assets() {
            local release_to_validate=$1 mode=${2:-published} assets download_dir file asset_id
            assets="$(
              gh api --paginate \
                "repos/$REPOSITORY/releases/$release_to_validate/assets?per_page=100" \
                --slurp
            )"
            test "$(jq '[.[][]] | length' <<< "$assets")" = "${#release_files[@]}"
            download_dir="$RUNNER_TEMP/release-download-$release_to_validate"
            rm -rf "$download_dir"
            mkdir -p "$download_dir"
            for file in "${release_files[@]}"; do
              asset_id="$(
                jq -r --arg name "$file" \
                  '[.[][] | select(.name == $name)] | if length == 1 then .[0].id else error("missing or duplicate release asset") end' \
                  <<< "$assets"
              )"
              gh api -H 'Accept: application/octet-stream' \
                "repos/$REPOSITORY/releases/assets/$asset_id" > "$download_dir/$file"
              if [ "$mode" = compare-local ]; then
                cmp "release-publish/$file" "$download_dir/$file"
              fi
            done
            bun scripts/release-artifacts.ts verify \
              --input "$download_dir" \
              --source-revision "$TARGET_SHA" \
              --ci-run-id "$RUN_ID" \
              --version "$VERSION"
            (cd "$download_dir" && sha256sum --check SHA256SUMS)
          }
          delete_release_id() {
            local release_to_delete=$1 attempt remaining
            for attempt in 1 2 3; do
              if gh api --method DELETE "repos/$REPOSITORY/releases/$release_to_delete"; then
                return
              fi
              remaining="$(
                retry_api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
                  jq --argjson id "$release_to_delete" '[.[][] | select(.id == $id)] | length'
              )"
              if [ "$remaining" = 0 ]; then
                return
              fi
              sleep "$attempt"
            done
            return 1
          }
          delete_tag_ref() {
            local expected_object=$1 attempt live_ref auth_header git_dir
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
            git_dir="$RUNNER_TEMP/hs-buddy-release-git"
            if [ ! -d "$git_dir" ]; then
              git init --bare "$git_dir" >/dev/null
            fi
            for attempt in 1 2 3; do
              if git --git-dir="$git_dir" \
                -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
                push "https://github.com/$REPOSITORY.git" \
                --force-with-lease="refs/tags/$TAG:$expected_object" \
                ":refs/tags/$TAG"; then
                return
              fi
              live_ref="$(
                retry_api "repos/$REPOSITORY/git/matching-refs/tags/$TAG" |
                  jq -c --arg ref "refs/tags/$TAG" \
                    '[.[] | select(.ref == $ref)] | if length > 1 then error("duplicate exact tag refs") else .[0] // null end'
              )"
              if [ "$live_ref" = null ]; then
                return
              fi
              if [ "$(jq -r .object.sha <<< "$live_ref")" != "$expected_object" ]; then
                echo "Refusing to delete replacement tag object" >&2
                return 1
              fi
              sleep "$attempt"
            done
            return 1
          }
          restore_tag_ref() {
            local object=$1 attempt
            for attempt in 1 2 3; do
              if gh api --method POST "repos/$REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null; then
                return
              fi
              if [ "$(retry_api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$object" ]; then
                return
              fi
              sleep "$attempt"
            done
            return 1
          }
          cleanup_owned_artifacts() {
            if [ "$managed_release" = false ]; then
              cleanup_release="$(
                retry_api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
                  jq -c --arg tag "$TAG" \
                    '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("duplicate exact releases") else .[0] // null end'
              )"
              if [ "$cleanup_release" != null ] && \
                [ "$(jq -r .draft <<< "$cleanup_release")" = true ] && \
                grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$cleanup_release")"; then
                managed_release=true
                release_id="$(jq -r .id <<< "$cleanup_release")"
              elif [ "$cleanup_release" != null ]; then
                tag_owned=false
              fi
            fi
            if [ "$managed_release" = true ]; then
              live_release="$(retry_api "repos/$REPOSITORY/releases/$release_id")"
              test "$(jq -r .draft <<< "$live_release")" = true
              test "$(jq -r .tag_name <<< "$live_release")" = "$TAG"
              grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$live_release")"
              delete_release_id "$release_id"
              managed_release=false
            fi
            if [ "$tag_owned" = false ]; then
              cleanup_tag_ref="$(
                retry_api "repos/$REPOSITORY/git/matching-refs/tags/$TAG" |
                  jq -c --arg ref "refs/tags/$TAG" \
                    '[.[] | select(.ref == $ref)] | if length > 1 then error("duplicate exact tag refs") else .[0] // null end'
              )"
              if [ "$cleanup_tag_ref" != null ] && \
                [ "$(jq -r .object.type <<< "$cleanup_tag_ref")" = tag ]; then
                cleanup_tag_message="$(
                  retry_api \
                    "repos/$REPOSITORY/git/tags/$(jq -r .object.sha <<< "$cleanup_tag_ref")" \
                    --jq .message
                )"
                if [ "$cleanup_tag_message" = "Qualified by CI run $tag_owner_run_id" ] && \
                  [ "$(retry_command resolve_tag)" = "$tag_owned_target" ]; then
                  tag_owned=true
                  tag_owned_object="$(jq -r .object.sha <<< "$cleanup_tag_ref")"
                fi
              fi
            fi
            if [ "$tag_owned" = true ]; then
              live_tag_ref="$(retry_api "repos/$REPOSITORY/git/ref/tags/$TAG")"
              if [ "$(jq -r .object.type <<< "$live_tag_ref")" = tag ]; then
                live_tag_message="$(
                  retry_api \
                    "repos/$REPOSITORY/git/tags/$(jq -r .object.sha <<< "$live_tag_ref")" \
                    --jq .message
                )"
                live_tag_object="$(jq -r .object.sha <<< "$live_tag_ref")"
                live_target="$(retry_command resolve_tag)"
                if [ "$live_tag_object" = "$tag_owned_object" ] && \
                  [ "$live_tag_message" = "Qualified by CI run $tag_owner_run_id" ] && \
                  [ "$live_target" = "$tag_owned_target" ]; then
                  release_count_before_tag_delete="$(
                    retry_api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
                      jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length'
                  )"
                  test "$release_count_before_tag_delete" = 0
                  delete_tag_ref "$tag_owned_object"
                  release_count_after_tag_delete="$(
                    retry_api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
                      jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length'
                  )"
                  if [ "$release_count_after_tag_delete" != 0 ]; then
                    restore_tag_ref "$tag_owned_object"
                    return 1
                  fi
                  tag_owned=false
                else
                  echo "Skipping tag cleanup because ownership or target changed" >&2
                fi
              fi
            fi
          }
          on_error() {
            local status=$?
            trap - ERR
            cleanup_owned_artifacts
            exit "$status"
          }
          trap on_error ERR

          abort_if_stale() {
            local current_main
            if ! current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"; then
              trap - ERR
              cleanup_owned_artifacts
              exit 1
            fi
            if [ "$current_main" = "$TARGET_SHA" ]; then
              return
            fi
            echo "::error::main superseded $TARGET_SHA before release publication"
            trap - ERR
            cleanup_owned_artifacts
            exit 1
          }

          # Exact list filtering distinguishes absence from API failure and
          # lets a retry recover owned draft/tag state before rejecting stale work.
          tag_ref="$(
            gh api "repos/$REPOSITORY/git/matching-refs/tags/$TAG" |
              jq -c --arg ref "refs/tags/$TAG" \
                '[.[] | select(.ref == $ref)] | if length > 1 then error("duplicate exact tag refs") else .[0] // null end'
          )"
          release_json="$(
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
              jq -c --arg tag "$TAG" \
                '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("duplicate exact releases") else .[0] // null end'
          )"
          mapfile -t release_files < <(
            find release-publish -maxdepth 1 -type f -printf '%f\n' | sort
          )
          test "${#release_files[@]}" = 6
          expected_prerelease=false
          prerelease_args=()
          version_without_build="${VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            expected_prerelease=true
            prerelease_args=(--prerelease)
          fi

          if [ "$tag_ref" != null ]; then
            tag_target="$(resolve_tag)"
            live_tag_ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")"
            tag_message=""
            if [ "$(jq -r .object.type <<< "$live_tag_ref")" = tag ]; then
              tag_message="$(
                gh api "repos/$REPOSITORY/git/tags/$(jq -r .object.sha <<< "$live_tag_ref")" \
                  --jq .message
              )"
            fi

            if [ "$tag_target" != "$TARGET_SHA" ] && \
              [[ "$tag_message" =~ ^Qualified\ by\ CI\ run\ ([0-9]+)$ ]]; then
              previous_run_id="${BASH_REMATCH[1]}"
              previous_tag_object="$(jq -r .object.sha <<< "$live_tag_ref")"
              tag_owned=true
              tag_owned_object="$previous_tag_object"
              tag_owner_run_id="$previous_run_id"
              tag_owned_target="$tag_target"
              release_marker="<!-- hs-buddy-release-ci:$previous_run_id -->"
              if [ "$release_json" != null ]; then
                previous_release_id="$(jq -r .id <<< "$release_json")"
                managed_release=true
                release_id="$previous_release_id"
                live_previous_release="$(
                  gh api "repos/$REPOSITORY/releases/$previous_release_id"
                )"
                test "$(jq -r .draft <<< "$live_previous_release")" = true
                test "$(jq -r .tag_name <<< "$live_previous_release")" = "$TAG"
                grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$live_previous_release")"
                delete_release_id "$previous_release_id"
                managed_release=false
              fi
              replacement_release_count="$(
                gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
                  jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length'
              )"
              test "$replacement_release_count" = 0
              test "$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = \
                "$previous_tag_object"
              test "$(resolve_tag)" = "$tag_target"
              delete_tag_ref "$previous_tag_object"
              replacement_release_count="$(
                gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
                  jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length'
              )"
              if [ "$replacement_release_count" != 0 ]; then
                restore_tag_ref "$previous_tag_object"
                exit 1
              fi
              tag_owned=false
              tag_owner_run_id="$RUN_ID"
              tag_owned_target="$TARGET_SHA"
              release_marker="<!-- hs-buddy-release-ci:$RUN_ID -->"
              tag_ref=null
              release_json=null
            else
              test "$tag_target" = "$TARGET_SHA"
              if [ "$tag_message" = "Qualified by CI run $RUN_ID" ]; then
                tag_owned=true
                tag_owned_object="$(jq -r .object.sha <<< "$live_tag_ref")"
              fi
            fi
          fi

          if [ "$release_json" != null ]; then
            if [ "$(jq -r .draft <<< "$release_json")" = false ]; then
              test "$(resolve_tag)" = "$TARGET_SHA"
              test "$(jq -r .prerelease <<< "$release_json")" = "$expected_prerelease"
              public_release_id="$(jq -r .id <<< "$release_json")"
              validate_release_assets "$public_release_id"
              echo "Release $TAG already has the complete verified asset set"
              exit 0
            fi
            grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$release_json")"
            managed_release=true
            release_id="$(jq -r .id <<< "$release_json")"
          fi
          abort_if_stale

          if [ "$tag_ref" = null ]; then
            # An annotated tag object is the ownership marker. After an
            # ambiguous ref response, the live ref must point to this exact
            # object before this run may delete it during stale cleanup.
            tag_object="$(
              gh api --method POST "repos/$REPOSITORY/git/tags" \
                -f tag="$TAG" \
                -f message="Qualified by CI run $RUN_ID" \
                -f object="$TARGET_SHA" \
                -f type=commit \
                --jq .sha
            )"
            if ! gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$tag_object" >/dev/null; then
              echo "Tag creation did not return success; verifying the live ref" >&2
            fi
            live_tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
            if [ "$live_tag_object" = "$tag_object" ]; then
              tag_owned=true
              tag_owned_object="$tag_object"
            fi
          fi
          test "$(resolve_tag)" = "$TARGET_SHA"
          abort_if_stale

          if [ "$release_json" = null ]; then
            if ! gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --draft \
              "${prerelease_args[@]}" \
              --title "$TAG" \
              --notes "$(printf '%s\n\nQualified commit: `%s`\nCI run: https://github.com/%s/actions/runs/%s\n' "$release_marker" "$TARGET_SHA" "$REPOSITORY" "$RUN_ID")" \
              --generate-notes; then
              echo "Draft creation did not return success; verifying ownership" >&2
            fi
            release_json="$(wait_for_exact_release)"
            test "$(jq -r .draft <<< "$release_json")" = true
            grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$release_json")"
            managed_release=true
            release_id="$(jq -r .id <<< "$release_json")"
          fi

          existing_assets="$(gh api --paginate "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" --slurp)"
          mapfile -t existing_asset_ids < <(jq -r '.[][] | .id' <<< "$existing_assets")
          for asset_id in "${existing_asset_ids[@]}"; do
            gh api --method DELETE "repos/$REPOSITORY/releases/assets/$asset_id"
          done
          existing_assets="$(gh api --paginate "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" --slurp)"
          test "$(jq '[.[][]] | length' <<< "$existing_assets")" = 0
          gh release upload "$TAG" release-publish/* --repo "$REPOSITORY"
          validate_release_assets "$release_id" compare-local

          # This is the publication decision point. Re-read the exact release
          # ID and tag object so replacement artifacts cannot inherit approval.
          abort_if_stale
          live_release="$(gh api "repos/$REPOSITORY/releases/$release_id")"
          test "$(jq -r .draft <<< "$live_release")" = true
          test "$(jq -r .tag_name <<< "$live_release")" = "$TAG"
          test "$(jq -r .prerelease <<< "$live_release")" = "$expected_prerelease"
          test "$(jq '.assets | length' <<< "$live_release")" = "${#release_files[@]}"
          grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$live_release")"
          test "$(resolve_tag)" = "$TARGET_SHA"
          if [ "$tag_owned" = true ]; then
            test "$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = \
              "$tag_owned_object"
          fi
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          test "$(gh api "repos/$REPOSITORY/releases/$release_id" --jq .draft)" = false
          test "$(resolve_tag)" = "$TARGET_SHA"
          managed_release=false
          tag_owned=false
          trap - ERR

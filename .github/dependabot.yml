updates:
- commit-message:
    prefix: "chore(deps):"
  directory: /
  ignore:
  - dependency-name: "typescript"
    versions:
    - ">=6.1.0"
  labels:
  - dependencies
  groups:
    opentelemetry:
      patterns:
      - "@opentelemetry/*"
      update-types:
      - minor
      - patch
    test-toolchain:
      patterns:
      - "vitest"
      - "@vitest/*"
      - "@amiceli/vitest-cucumber"
      - "@stryker-mutator/core"
      - "@stryker-mutator/vitest-runner"
  open-pull-requests-limit: 5
  # The root project is managed by Bun (bun.lock, no package-lock.json);
  # Dependabot's npm_and_yarn updater refuses it and asks for this ecosystem.
  package-ecosystem: bun
  schedule:
    day: monday
    interval: weekly
- commit-message:
    prefix: "ci(deps):"
  directory: /
  ignore:
  - dependency-name: "github/gh-aw-actions/**"
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - dependencies
  open-pull-requests-limit: 5
  package-ecosystem: github-actions
  schedule:
    day: monday
    interval: weekly
- commit-message:
    prefix: "chore(deps):"
  directory: /rust
  labels:
  - dependencies
  open-pull-requests-limit: 5
  package-ecosystem: cargo
  schedule:
    day: monday
    interval: weekly
version: 2

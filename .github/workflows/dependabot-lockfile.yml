name: Dependabot Lockfile Fix

# Auto-updates bun.lock when Dependabot opens or updates a PR.
# Dependabot doesn't natively support Bun lockfiles, so this workflow
# runs `bun install` and commits the updated lockfile back to the PR branch.

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/')
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Update lockfile
        run: bun install --no-frozen-lockfile

      - name: Verify frozen install
        run: bun install --frozen-lockfile

      - name: Commit updated lockfile
        id: commit-lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update bun.lock for dependabot PR"
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
              push origin "HEAD:${GITHUB_HEAD_REF}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve follow-up runs
        if: steps.commit-lockfile.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.commit-lockfile.outputs.sha }}
          TARGET_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXCLUDED_WORKFLOW_PATH: .github/workflows/dependabot-lockfile.yml
        run: bun scripts/approve-dependabot-followup-runs.ts

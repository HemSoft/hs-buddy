name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Verify exact CI qualification
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$TARGET_SHA"
          jobs="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --slurp)"
          count="$(jq '[.[].jobs[] | select(.name == "ci-complete" and .status == "completed" and .conclusion == "success")] | length' <<< "$jobs")"
          test "$count" = "1"
          test "$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$TARGET_SHA"

      - name: Read candidate version without checkout
        id: version
        run: |
          set -euo pipefail
          parent="$(gh api "repos/$REPOSITORY/git/commits/$TARGET_SHA" --jq '.parents[0].sha')"
          version="$(gh api "repos/$REPOSITORY/contents/package.json?ref=$TARGET_SHA" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
          parent_version="$(gh api "repos/$REPOSITORY/contents/package.json?ref=$parent" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::Invalid version in package.json: '$version'"
            exit 1
          fi
          if [ "$version" = "$parent_version" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "package.json version did not change"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Recheck current candidate
        if: steps.version.outputs.eligible == 'true'
        run: test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$TARGET_SHA"

      - name: Create immutable tag and release
        if: steps.version.outputs.eligible == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          resolve_tag() {
            local object type
            object="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")"
            type="$(jq -r .object.type <<< "$object")"
            object="$(jq -r .object.sha <<< "$object")"
            if [ "$type" = "tag" ]; then
              object="$(gh api "repos/$REPOSITORY/git/tags/$object" --jq .object.sha)"
            fi
            printf '%s\n' "$object"
          }

          # matching-refs returns an empty array when the exact tag is absent,
          # while API/auth/rate-limit failures remain fatal under set -e.
          tag_ref="$(
            gh api "repos/$REPOSITORY/git/matching-refs/tags/$TAG" |
              jq -c --arg ref "refs/tags/$TAG" \
                '[.[] | select(.ref == $ref)] | if length > 1 then error("duplicate exact tag refs") else .[0] // null end'
          )"
          # Do not leave an orphan tag for a candidate superseded between the
          # job-level check and this atomic ref claim.
          test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$TARGET_SHA"
          if [ "$tag_ref" != "null" ]; then
            test "$(resolve_tag)" = "$TARGET_SHA"
          else
            # Git ref creation is atomic. If another writer wins the race or
            # the response is lost, resolve_tag below still requires the live
            # tag to point to this qualified commit before release creation.
            if ! gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$TARGET_SHA" >/dev/null; then
              echo "Tag creation did not return success; verifying the live ref" >&2
            fi
          fi
          test "$(resolve_tag)" = "$TARGET_SHA"

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists at the qualified commit"
            exit 0
          fi

          # Recheck immediately before the only publishing command. The tag
          # was already atomically claimed and verified at TARGET_SHA.
          test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$TARGET_SHA"
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
          test "$(resolve_tag)" = "$TARGET_SHA"

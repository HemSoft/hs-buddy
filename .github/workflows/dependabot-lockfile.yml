name: Dependabot Lockfile Fix

# Auto-updates bun.lock when Dependabot opens or updates a PR.
# Dependabot doesn't natively support Bun lockfiles, so this workflow
# runs `bun install` and commits the updated lockfile back to the PR branch.

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/')
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.12.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Update lockfile
        run: bun install --no-frozen-lockfile

      - name: Verify frozen install
        run: bun install --frozen-lockfile

      - name: Commit updated lockfile
        id: commit-lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update bun.lock for dependabot PR"
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
              push origin "HEAD:${GITHUB_HEAD_REF}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch generated-commit CI
        id: dispatch-ci
        if: steps.commit-lockfile.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ github.head_ref }}
          TARGET_SHA: ${{ steps.commit-lockfile.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "$TARGET_REF"
          # GitHub-side queueing can delay the dispatched run's appearance well
          # past a minute, so poll for up to five minutes. If it never shows up,
          # degrade to a warning only once some other ci.yml run is confirmed
          # for the generated SHA; otherwise fail so the gap is visible.
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --workflow ci.yml \
              --event workflow_dispatch \
              --commit "$TARGET_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Dispatched CI run $run_id for $TARGET_SHA"
              exit 0
            fi
            echo "Waiting for dispatched CI run ($attempt/60)"
            sleep 5
          done
          fallback_run="$(gh run list \
            --workflow ci.yml \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -n "$fallback_run" ]; then
            echo "::warning::No workflow_dispatch CI run appeared for $TARGET_SHA within five minutes; ci.yml run $fallback_run covers the commit instead, so it will not be watched here."
            exit 0
          fi
          echo "::error::No ci.yml run of any kind appeared for $TARGET_SHA; refusing to skip generated-commit validation."
          exit 1

      - name: Wait for generated-commit CI
        if: steps.commit-lockfile.outputs.pushed == 'true' && steps.dispatch-ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.dispatch-ci.outputs.run_id }}
          TARGET_REF: ${{ github.head_ref }}
          TARGET_SHA: ${{ steps.commit-lockfile.outputs.sha }}
        run: |
          set +e
          gh run watch "${{ steps.dispatch-ci.outputs.run_id }}" --compact --exit-status
          watch_exit=$?
          set -e
          conclusion="$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // ""')"
          if [ "$conclusion" = "cancelled" ]; then
            # Only treat cancellation as neutral when a newer lockfile commit
            # actually superseded this one through CI's branch concurrency
            # group; an operator cancel with no successor must stay red.
            current_head="$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)"
            if [ -n "$current_head" ] && [ "$current_head" != "$TARGET_SHA" ]; then
              echo "::warning::Dispatched CI run $RUN_ID was cancelled; lockfile branch moved to $current_head whose own CI gates this PR."
              exit 0
            fi
            echo "::error::Dispatched CI run $RUN_ID was cancelled and no newer commit supersedes $TARGET_SHA."
            exit 1
          fi
          exit $watch_exit

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Verify exact CI qualification
        run: |
          set -euo pipefail
          jobs="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --slurp)"
          count="$(jq '[.[].jobs[] | select(.name == "ci-complete" and .status == "completed" and .conclusion == "success")] | length' <<< "$jobs")"
          test "$count" = "1"
          test "$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$TARGET_SHA"

      - name: Read candidate version without checkout
        id: version
        run: |
          set -euo pipefail
          parent="$(gh api "repos/$REPOSITORY/git/commits/$TARGET_SHA" --jq '.parents[0].sha')"
          version="$(gh api "repos/$REPOSITORY/contents/package.json?ref=$TARGET_SHA" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
          parent_version="$(gh api "repos/$REPOSITORY/contents/package.json?ref=$parent" --jq .content | tr -d '\n' | base64 -d | jq -r .version)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::Invalid version in package.json: '$version'"
            exit 1
          fi
          if [ "$version" = "$parent_version" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "package.json version did not change"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create immutable tag and release
        if: steps.version.outputs.eligible == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          resolve_tag() {
            local object type
            object="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")"
            type="$(jq -r .object.type <<< "$object")"
            object="$(jq -r .object.sha <<< "$object")"
            if [ "$type" = "tag" ]; then
              object="$(gh api "repos/$REPOSITORY/git/tags/$object" --jq .object.sha)"
            fi
            printf '%s\n' "$object"
          }

          tag_owned=false
          tag_owned_object=""
          managed_release=false
          release_id=""
          release_marker="<!-- hs-buddy-release-ci:$RUN_ID -->"
          abort_if_stale() {
            local current_main
            current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
            if [ "$current_main" = "$TARGET_SHA" ]; then
              return
            fi
            echo "::error::main superseded $TARGET_SHA before release publication"
            if [ "$managed_release" = true ]; then
              live_release="$(gh api "repos/$REPOSITORY/releases/$release_id")"
              test "$(jq -r .draft <<< "$live_release")" = true
              test "$(jq -r .tag_name <<< "$live_release")" = "$TAG"
              grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$live_release")"
              gh api --method DELETE "repos/$REPOSITORY/releases/$release_id"
            fi
            if [ "$tag_owned" = true ]; then
              live_tag_ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")"
              if [ "$(jq -r .object.type <<< "$live_tag_ref")" = tag ]; then
                live_tag_message="$(
                  gh api \
                    "repos/$REPOSITORY/git/tags/$(jq -r .object.sha <<< "$live_tag_ref")" \
                    --jq .message
                )"
                live_tag_object="$(jq -r .object.sha <<< "$live_tag_ref")"
                live_target="$(resolve_tag)"
                if [ "$live_tag_object" = "$tag_owned_object" ] && \
                  [ "$live_tag_message" = "Qualified by CI run $RUN_ID" ] && \
                  [ "$live_target" = "$TARGET_SHA" ]; then
                  gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$TAG"
                else
                  echo "Skipping tag cleanup because ownership or target changed" >&2
                fi
              fi
            fi
            exit 1
          }

          # Exact list filtering distinguishes absence from API failure and
          # lets a retry recover owned draft/tag state before rejecting stale work.
          tag_ref="$(
            gh api "repos/$REPOSITORY/git/matching-refs/tags/$TAG" |
              jq -c --arg ref "refs/tags/$TAG" \
                '[.[] | select(.ref == $ref)] | if length > 1 then error("duplicate exact tag refs") else .[0] // null end'
          )"
          release_json="$(
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
              jq -c --arg tag "$TAG" \
                '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("duplicate exact releases") else .[0] // null end'
          )"

          if [ "$tag_ref" != null ]; then
            test "$(resolve_tag)" = "$TARGET_SHA"
            live_tag_ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")"
            if [ "$(jq -r .object.type <<< "$live_tag_ref")" = tag ]; then
              tag_message="$(
                gh api "repos/$REPOSITORY/git/tags/$(jq -r .object.sha <<< "$live_tag_ref")" \
                  --jq .message
              )"
              if [ "$tag_message" = "Qualified by CI run $RUN_ID" ]; then
                tag_owned=true
                tag_owned_object="$(jq -r .object.sha <<< "$live_tag_ref")"
              fi
            fi
          fi

          if [ "$release_json" != null ]; then
            if [ "$(jq -r .draft <<< "$release_json")" = false ]; then
              test "$(resolve_tag)" = "$TARGET_SHA"
              echo "Release $TAG already exists at the qualified commit"
              exit 0
            fi
            grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$release_json")"
            managed_release=true
            release_id="$(jq -r .id <<< "$release_json")"
          fi
          abort_if_stale

          if [ "$tag_ref" = null ]; then
            # An annotated tag object is the ownership marker. After an
            # ambiguous ref response, the live ref must point to this exact
            # object before this run may delete it during stale cleanup.
            tag_object="$(
              gh api --method POST "repos/$REPOSITORY/git/tags" \
                -f tag="$TAG" \
                -f message="Qualified by CI run $RUN_ID" \
                -f object="$TARGET_SHA" \
                -f type=commit \
                --jq .sha
            )"
            if ! gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$tag_object" >/dev/null; then
              echo "Tag creation did not return success; verifying the live ref" >&2
            fi
            live_tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
            if [ "$live_tag_object" = "$tag_object" ]; then
              tag_owned=true
              tag_owned_object="$tag_object"
            fi
          fi
          test "$(resolve_tag)" = "$TARGET_SHA"
          abort_if_stale

          if [ "$release_json" = null ]; then
            if ! gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$TAG" \
              --notes "$release_marker" \
              --generate-notes; then
              echo "Draft creation did not return success; verifying ownership" >&2
            fi
            release_json="$(
              gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --slurp |
                jq -c --arg tag "$TAG" \
                  '[.[][] | select(.tag_name == $tag)] | if length != 1 then error("expected one exact release") else .[0] end'
            )"
            test "$(jq -r .draft <<< "$release_json")" = true
            grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$release_json")"
            managed_release=true
            release_id="$(jq -r .id <<< "$release_json")"
          fi

          # This is the publication decision point. Re-read the exact release
          # ID and tag object so replacement artifacts cannot inherit approval.
          abort_if_stale
          live_release="$(gh api "repos/$REPOSITORY/releases/$release_id")"
          test "$(jq -r .draft <<< "$live_release")" = true
          test "$(jq -r .tag_name <<< "$live_release")" = "$TAG"
          grep -Fq "$release_marker" <<< "$(jq -r .body <<< "$live_release")"
          test "$(resolve_tag)" = "$TARGET_SHA"
          if [ "$tag_owned" = true ]; then
            test "$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = \
              "$tag_owned_object"
          fi
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          test "$(gh api "repos/$REPOSITORY/releases/$release_id" --jq .draft)" = false
          test "$(resolve_tag)" = "$TARGET_SHA"
